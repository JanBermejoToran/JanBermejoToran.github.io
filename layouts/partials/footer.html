<!-- Footer -->
<footer class="mt-32 text-center">
    <div class="max-w-3xl mx-auto">
        <div class="border-t border-border-primary-light dark:border-border-primary-dark pt-5">
            <div class="flex flex-col items-center justify-center gap-2">
                {{ $authorData := index site.Data .Language.Lang "author" }}
                {{ $author := cond (and $authorData $authorData.author) $authorData.author site.Params }}
                {{ with $author }}
                <p class="text-text-secondary-light dark:text-text-secondary-dark text-xm pb-12">© {{ now.Format "2006" }} {{ .name }}</p>
                {{ end }}
            </div>
        </div>
    </div>
</footer>

<!-- Lightbox -->
<style>
  .prose img { cursor: zoom-in; }
  #lightbox {
    position: fixed; inset: 0; z-index: 9999;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.9); cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 95vw; max-height: 95vh; object-fit: contain;
    border-radius: 8px; transform: scale(.92); opacity: 0;
    transition: transform .25s ease, opacity .25s ease;
  }
  #lightbox.open img { transform: scale(1); opacity: 1; }
</style>

<div id="lightbox" role="dialog" aria-modal="true"><img alt=""></div>

<script>
  (function () {
    var lb = document.getElementById('lightbox');
    var big = lb.querySelector('img');
    function close() { lb.classList.remove('open'); document.body.style.overflow = ''; }
    document.querySelectorAll('.prose img').forEach(function (img) {
      img.addEventListener('click', function () {
        big.src = img.currentSrc || img.src;
        big.alt = img.alt;
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });
    lb.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  })();
</script>
