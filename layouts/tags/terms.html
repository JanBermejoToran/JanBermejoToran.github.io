{{ define "main" }}

<div class="w-full md:w-3/4 lg:w-1/2 mx-auto px-4 py-12">

    <h1 class="text-5xl font-bold mb-6 text-text-primary-light dark:text-text-primary-dark">
        {{ .Title }}
    </h1>

    <p class="text-text-secondary-light dark:text-text-secondary-dark mb-12">
        Posts tagged with <span class="font-medium text-text-primary-light dark:text-text-primary-dark">"{{ .Title }}"</span>
    </p>

    <div class="space-y-12 max-w-3xl mx-auto">

        {{ range .Pages }}

{{ partial "post-card.html" . }}

        {{ end }}

    </div>

</div>

{{ end }}
